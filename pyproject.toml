[project]
name = "qa_acreditacion"
version = "0.1.0"
description = "Sistema de preguntas y respuestas (QA) para documentos con factores de acreditación de la escuela de ingeniería de sistemas y computación (EISC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "openrouter>=0.11.46",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pymupdf4llm>=1.28.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.4",
    "streamlit[pdf]>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
